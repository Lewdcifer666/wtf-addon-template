name: Reconcile private learning
on:
  workflow_run:
    workflows: ['Stage private interpretation']
    types: [completed]
  push:
    branches: [main]
    paths: ['data/feedback/**', 'learning/**', 'engine/**', 'package*.json', '.github/workflows/learning-*.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      provenance_probe:
        description: Explicit read-only synthetic OIDC provenance probe; no feedback or Git writes
        type: boolean
        default: false
      consume_genre:
        type: choice
        default: none
        options: [none, action, anime, fantasy, mystery, scifi, thriller]
      research_commit:
        description: Optional staged research commit to verify read-only
        type: string
        default: ''
      research_date:
        description: Optional original Berlin date for delayed research verification
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: private-learning-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'Lewdcifer666/wtf-scifi-feedback' && (github.event_name != 'workflow_dispatch' || (inputs.consume_genre == 'none' && !inputs.provenance_probe))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Pin trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY" --jq .private)" = true
          revision=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Test only trusted code and synthetic fixtures
        run: npm test
      - name: Reconcile pinned private evidence
        env:
          GH_TOKEN: ${{ github.token }}
          LEARNING_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            node learning/reconcile.mjs --dry-run
          else
            node learning/reconcile.mjs
          fi
  consume:
    if: github.repository == 'Lewdcifer666/wtf-scifi-feedback' && github.event_name == 'workflow_dispatch' && inputs.consume_genre != 'none' && !inputs.provenance_probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pin trusted main for read-only verification
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY" --jq .private)" = true
          revision=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Read current private handoff or verify its research commit
        env:
          GH_TOKEN: ${{ github.token }}
          LEARNING_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
          CONSUME_GENRE: ${{ inputs.consume_genre }}
          RESEARCH_COMMIT: ${{ inputs.research_commit }}
          RESEARCH_DATE: ${{ inputs.research_date }}
        run: |
          set -euo pipefail
          [[ "$CONSUME_GENRE" =~ ^(action|anime|fantasy|mystery|scifi|thriller)$ ]]
          if [ -n "$RESEARCH_COMMIT" ]; then
            [[ "$RESEARCH_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            if [ -n "$RESEARCH_DATE" ]; then
              [[ "$RESEARCH_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
              node learning/reconcile.mjs --verify-research "$CONSUME_GENRE" "$RESEARCH_COMMIT" "$RESEARCH_DATE"
            else
              node learning/reconcile.mjs --verify-research "$CONSUME_GENRE" "$RESEARCH_COMMIT"
            fi
          else
            test -z "$RESEARCH_DATE"
            node learning/reconcile.mjs --consume "$CONSUME_GENRE"
          fi
  provenance-probe:
    if: github.repository == 'Lewdcifer666/wtf-scifi-feedback' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.provenance_probe && inputs.consume_genre == 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Pin trusted main for metadata-only probe
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY" --jq .private)" = true
          revision=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify only synthetic provenance
        env:
          GH_TOKEN: ${{ github.token }}
          LEARNING_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        run: node learning/reconcile.mjs --probe-proof
